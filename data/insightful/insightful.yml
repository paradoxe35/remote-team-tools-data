markdown: >-
  ## Overview


  Insightful (formerly Workpuls) is a flexible employee monitoring platform
  offering real-time visibility into team activities. It supports two deployment
  modes: automatic tracking for teams on company computers and a clock in/out
  system for remote workers on personal devices, balancing oversight with
  employee trust.


  ## Features


  - Real-time monitoring and productivity tracking

  - App usage analytics and website monitoring

  - Two deployment modes: automatic tracking (company computers) and clock
  in/out (personal devices)

  - Custom reports with clear visuals to identify productivity trends and
  workflow issues

  - Manual time entry and activity alerts

  - Historical data access

  - Role-based labeling of apps and websites as productive or non-productive

  - Simple, clean user interface requiring minimal training


  ## Integrations


  - HR and productivity tools


  ## Pricing


  Starting at $6.40 per user per month. No video recording is offered for
  compliance reasons.
