name: Wrike
description: Wrike is an enterprise-grade project management and collaboration
  platform offering customizable workflows, real-time collaboration, and
  advanced reporting for teams of all sizes. Key features include Gantt charts,
  custom dashboards, time tracking, proofing and approval workflows, and
  AI-powered task generation. Ideal for marketing teams and organizations
  managing complex, cross-functional projects, it offers more advanced reporting
  and proofing capabilities than Monday.com but with a steeper learning curve.
source_url: https://www.wrike.com
category: Project Management
tags:
  - enterprise
  - Gantt charts
  - team collaboration
markdown: >-
  ## Overview

  Wrike provides robust project management capabilities for large teams and
  enterprises, with features like workflow automation, resource management, and
  comprehensive reporting.


  ## Features

  - Advanced Gantt charts for visual planning

  - Dynamic request forms for client feedback

  - Real-time document collaboration

  - Custom workflows and dashboards

  - Time tracking and workload management


  ## Pricing

  - Free trial available

  - Team plans from $15/user/month

  - Enterprise plans (custom pricing)
