  ## Overview

  Huddle01 is a decentralized video-calling app designed for remote teams,
  offering secure communication without relying on centralized servers.


  ## Features

  - Collaborate, chat with teams, and share files

  - Screen share and record your video calls

  - Virtual backgrounds and default avatars

  - Keyboard shortcuts for all essential meeting functions


