name: Airtable
description: Airtable is a cloud-based collaborative database that combines
  spreadsheet flexibility with database power through customizable views, linked
  records, and multiple data types. Key features include Grid, Kanban, Calendar,
  and Gallery views, automations, an interface designer, and AI capabilities.
  Compared to traditional spreadsheets, Airtable offers relational data and
  structured workflows while remaining accessible to non-technical users.
