markdown: >-
  ## Overview


  Avoma focuses on the context around meetings beyond just transcription. It
  tracks speaking stats, filler word counts, monologues, and
  talking-to-listening ratios, helping teams understand pressing issues and
  improve performance.


  ## Features


  - Meeting transcription as a foundation

  - Speaking stats tracking: filler word count, monologues, talking-to-listening
  ratios

  - Call topic recording to identify pressing issues

  - AI scoring tools for sales team improvement

  - AI-powered transcript analysis for next steps

  - Automated generation of tailored follow-up emails

  - Slack notifications for product and sales teams when insights align with
  strategic priorities

  - Zapier integration for AI-orchestrated workflows


  ## Pricing


  Paid tiers available with specific pricing varying by plan.
