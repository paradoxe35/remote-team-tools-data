name: Linear
description: Streamlined issue-tracking and project management tool built for
  software teams with keyboard-first navigation, cycle-based sprint planning,
  roadmaps, and deep Git integration. Perfect for engineering teams seeking a
  fast, focused alternative to Jira. Compared to Jira, Linear trades extensive
  configurability for speed and an optimized developer experience.
source_url: https://linear.app
category: Task Management
tags:
  - agile
  - issue-tracking
  - project-management
markdown: |-
  ## Features

  - Real-time synchronization and offline access
  - Keyboard-first interface for efficiency
  - List and board views for visual task tracking
  - Cycle-based workload management
  - Integration with development workflows

  ## Pricing

  - Free plan with limited issues and file storage
  - Starter plan: $8/user/month
  - Professional plan: $12/user/month
  - Enterprise plans available
