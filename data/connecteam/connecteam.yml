markdown: >-
  ## Overview


  Connecteam is an all-in-one employee management app designed for deskless and
  frontline workers. It combines communication, scheduling, time tracking,
  training, and HR tools in a single mobile-first platform, helping
  organizations manage non-desk employees effectively.


  ## Key Features


  - Team communication with news feed, chat, and directory

  - Employee scheduling and shift management

  - Time tracking and attendance with GPS clock-in

  - Task management and checklists

  - Training and onboarding courses

  - Forms and surveys for feedback collection

  - HR document management

  - Time-off and leave management


  ## Integrations


  Integrates with popular payroll providers, calendar apps, and third-party
  tools via Zapier and native integrations.


  ## Pricing


  | Plan | Price | Details |

  |------|-------|---------|

  | Free | Free | Up to 10 users, basic features |

  | Basic | From $29/month | Up to 30 users, additional features |

  | Advanced | From $49/month | Unlimited users, premium features |

  | Expert | From $79/month | All features with priority support |


  Pricing billed annually; per-user pricing also available.
