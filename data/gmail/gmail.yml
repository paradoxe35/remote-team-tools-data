name: Gmail
description: Google's email service offering intelligent inbox organization with
  tabbed categories, smart compose and reply, robust spam filtering, email
  scheduling, confidential mode, and AI-powered writing assistance integrated
  with Google Workspace. Widely adopted for both personal and professional
  communication across remote teams. Excels at search and spam filtering
  compared to Outlook, though with less structured email organization.
