markdown: >-
  ## Overview


  Gmail is a cloud-based communication platform that allows team members to send
  and receive messages, documents, and files at their own pace. It supports
  threaded conversations and the ability to label and prioritize messages for
  later action.


  ## Features


  - Filters and labels for easy organization and sorting of messages to keep
  inboxes clutter-free

  - Offline access for reading emails and collaborating on documents with
  limited internet connectivity

  - Integration with Google services (Google Drive, Google Docs, Google
  Calendar) for easy collaboration

  - Search functionality to find emails by keywords, dates, and sender
  information

  - Automatic spam protection to identify and filter unwanted emails, phishing
  scams, and malicious attacks


  ## Use Cases


  - Email communication with remote team members, clients, and vendors

  - Sharing and collaborating on documents and files

  - Scheduling and managing calendar events and meetings

  - Managing contacts and mailing lists


  ## Pricing


  - Free: personal Gmail account with up to 15 GB storage for attachments and
  files

  - Google Workspace (business): starts at $6 per user per month
