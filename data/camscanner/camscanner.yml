markdown: >-
  ## Overview


  CamScanner is a mobile document scanning application that transforms
  smartphones into portable scanners. Users can capture physical documents with
  their phone camera, and the app automatically enhances image quality and
  background. Scanned documents can be edited on-device and exported in multiple
  formats, with OCR functionality enabling text extraction from scanned images.


  ## Features


  - Automatic image quality and background enhancement for scanned documents

  - OCR (Optical Character Recognition) for editing and searching PDF content

  - Synchronization across multiple devices

  - Mobile apps for iOS and Android

  - Wireless printing support

  - Global faxing support

  - Multiple image edit features for scanned documents

  - Export files in multiple formats


  ## Pros


  - OCR feature for editing and searching PDF documents

  - Synchronize with multiple devices

  - Mobile apps available for iOS and Android

  - Support for wireless printing and global faxing

  - Multiple image editing features


  ## Cons


  - Can get very expensive through in-app purchases


  ## Pricing


  Starting from $4.99/mo.
