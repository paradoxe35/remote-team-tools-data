name: Fireflies
description: Fireflies.ai is an AI meeting assistant that automatically joins
  calls, records conversations, and generates transcriptions with smart
  summaries and action item extraction. It offers unlimited meeting
  transcription, conversation analytics, CRM integrations, and a searchable
  meeting intelligence database, making it ideal for remote teams that need to
  capture and organize meeting insights. Compared to Otter.ai, Fireflies
  provides deeper CRM and business tool integrations for seamless workflow
  automation.
