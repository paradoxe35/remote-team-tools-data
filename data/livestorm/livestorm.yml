markdown: >-
  ## Overview


  Livestorm is a video engagement platform designed for both live and
  asynchronous communications. It supports hosting internal and external
  meetings, recording content, and making it available on demand.


  ## Features


  - Automatic recordings for creating asynchronous video resources like
  on-demand training, deminars, and walkthroughs

  - Events automation to set pre-recorded events (e.g., webinars) to start and
  end at specific times, imitating live events without intervention

  - Project management and collaboration via integrations with Slack, Miro, and
  Zapier for automated workflows

  - Quick scheduling using integrations with Google Calendar, Calendly, and
  Outlook

  - Email automation for sharing recordings, sending reminders, and async
  follow-ups


  ## Use Cases


  - Onboarding remote employees

  - Internal training and development

  - Webinars and product demos

  - Customer success events


  ## Pricing


  - Free trial: up to 20 minutes per event

  - Pro plan: $88 per month

  - Custom quotes available based on budget and business needs
