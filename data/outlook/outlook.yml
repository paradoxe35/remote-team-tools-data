name: Outlook
description: Microsoft's email and calendar management application with
  integrated task management, meeting scheduling, and AI-powered features via
  Copilot, offering focused inbox, calendar scheduling assistant, and deep
  Microsoft 365 ecosystem integration. Built for business email management,
  scheduling, and asynchronous team coordination across time zones. Provides
  more structured email organization and deeper enterprise calendar integration
  than Gmail.
