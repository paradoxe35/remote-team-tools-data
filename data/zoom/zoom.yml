name: Zoom
description: Zoom is a leading video conferencing platform that enables
  high-quality video meetings, webinars, and team chat for remote and hybrid
  teams. Key features include breakout rooms, screen sharing, recording, virtual
  backgrounds, and AI-powered meeting summaries. Compared to Google Meet and
  Microsoft Teams, Zoom offers superior video quality and more meeting-specific
  features, though it requires a separate subscription for advanced
  functionality.
source_url: https://zoom.us
category: Communication
tags:
  - video conferencing
  - remote meetings
  - screen sharing
markdown: >-
  ## Overview

  Zoom facilitates virtual meetings, webinars, and team collaboration with
  features like HD video, breakout rooms, and cloud recording.


  ## Features

  - High-definition video and audio

  - Screen sharing and annotation

  - Meeting recording and transcription

  - Virtual backgrounds and breakout rooms

  - Integration with calendar apps and collaboration tools


  ## Pricing

  - Free plan (up to 40 minutes/group meetings)

  - Pro plan ($14.99/host/month) with extended meeting time

  - Business and Enterprise plans (custom pricing)
