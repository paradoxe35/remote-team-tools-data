markdown: >-
  ## Overview


  Nextiva consolidates voice, video, team chat, SMS, and contact-center
  capabilities into a single platform, reducing app switching and enabling
  remote teams to manage customer conversations in one place. The platform
  strives for 99.999% uptime and offers built-in contact center features with AI
  call summaries and transcription.


  ## Features


  - HD voice, video meetings, screen sharing, and team messaging

  - Call routing, interactive voice response, call recording, and analytics

  - Integrations with Salesforce, HubSpot, and other major CRM platforms

  - Mobile and desktop apps that support working from anywhere

  - AI-powered transcription, call summaries, and real-time dashboards
  (available on higher plans)

  - Built-in contact center capabilities with omnichannel routing


  ## Pricing


  - Core plan: $15 per user per month

  - Engage and Power Suite CX plans available for advanced routing and AI
  features
