markdown: >-
  ## Overview


  Mattermost is an open-source messaging and collaboration platform designed for
  secure team communication. It provides self-hosted or cloud-deployed team chat
  with channels, file sharing, and integrations, making it ideal for
  organizations requiring full control over their communication infrastructure
  and data sovereignty.


  ## Key Features


  - Channel-based team messaging (public and private)

  - File sharing and threaded conversations

  - Self-hosted deployment option for data control

  - Enterprise-grade security and compliance

  - Custom integrations and webhooks

  - Mobile and desktop applications

  - Search and message history

  - Video and audio calling

  - DevOps workflows and automation

  - Incident management and playbooks


  ## Integrations


  Supports integrations with Jira, GitHub, GitLab, CircleCI, Jenkins, Zoom,
  Google Calendar, and many others via webhooks and plugins.


  ## Pricing


  | Plan | Price | Details |

  |------|-------|---------|

  | Team (Open Source) | Free | Community edition, self-hosted |

  | Starter | From $3/user/month | Cloud-hosted, additional features |

  | Professional | From $10/user/month | Advanced security and compliance |

  | Enterprise | Custom pricing | Enterprise-grade features, dedicated support |


  Free open-source edition available for self-hosting.
