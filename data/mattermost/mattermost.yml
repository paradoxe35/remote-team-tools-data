name: Mattermost
description: Mattermost is an open-source, self-hosted team messaging platform
  offering real-time chat, file sharing, webhooks, and enterprise-grade security
  (SOC 2, HIPAA) with full data control for air-gapped and regulated
  environments. It provides a Slack-like messaging experience with the added
  benefit of self-hosted data sovereignty, though it requires more operational
  overhead to maintain. Ideal for development teams, security-conscious
  organizations, and regulated industries that need secure, auditable
  communication.
