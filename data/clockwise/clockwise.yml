name: Clockwise
description: Clockwise is an AI-powered calendar optimization tool that
  automatically rearranges meetings and creates focus time blocks to maximize
  team productivity. With smart scheduling, focus time protection, team
  availability optimization, meeting analytics, and Google Calendar and Slack
  integrations, it is ideal for remote teams struggling with calendar overload.
  Compared to Reclaim.ai, Clockwise focuses more on meeting optimization whereas
  Reclaim offers broader habit and task scheduling features.
