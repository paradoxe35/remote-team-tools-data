name: Slite
description: Knowledge management and team documentation tool designed for fast,
  collaborative note-taking and company wikis with a focus on simplicity and
  searchability, featuring collaborative editing, AI-powered search, templates,
  content channels, and feedback reactions. Ideal for startups and remote teams
  seeking a simple, search-first wiki experience. Compared to Confluence, Slite
  offers a cleaner, faster experience but fewer enterprise governance features.
