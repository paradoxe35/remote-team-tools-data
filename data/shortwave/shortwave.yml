markdown: >-
  ## Overview


  Shortwave is an AI email assistant that consolidates multiple AI features into
  a single app. It is considered one of the leading AI email management tools,
  offering comprehensive features for Gmail users.


  ## Features


  - AI-powered email generation and reply drafting

  - Thread summarization

  - Natural language event scheduling

  - Deep inbox search with AI-powered responses

  - Gmail-only support (currently)


  ## Pricing


  Free and paid tiers available.
