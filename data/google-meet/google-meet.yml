name: Google Meet
description: Google Meet is an enterprise video conferencing platform with
  screen sharing, meeting recording, live captions, breakout rooms, and
  one-click joins via Google Calendar integration. It is ideal for teams already
  operating within the Google Workspace ecosystem. Compared to Zoom, it offers
  simpler setup through native Calendar integration but fewer advanced meeting
  features on its free tier.
source_url: https://meet.google.com
category: Team Communication
tags:
  - video-conferencing
  - google-workspace
  - collaboration
markdown: >-
  ## Features


  - Integration with Google Workspace (Gmail, Calendar, Drive)

  - Secure video meetings with up to 100 participants (free plan)

  - Screen sharing and real-time document collaboration

  - Extended meeting durations with paid plans

  - Meeting recordings stored in Google Drive


  ## Pricing


  - Free plan: 1-hour meetings, 100 participants

  - Workplace Essentials Plan: $8/user/month (300-hour max, 150 participants,
  cloud storage)
brand: Google
